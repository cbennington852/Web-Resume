  /* Full-screen overlay */
  #loader-overlay {
    position: fixed;

    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  /* Rotating CSS Spinner */
  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #3498db;
    /* Spinner color */
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {

  /* Class to fade out the loader via JS */

}

}

}

}

}

/* PyQtFluent Bottom Accent Indicator */
#tabs .ui-tabs-nav li.ui-tabs-active::after {
  content: "";

}

}
